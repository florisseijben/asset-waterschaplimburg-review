<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder granulariteitsniveaus watergang</title>
  <desc id="desc">Schematische placeholder voor drie granulariteitsniveaus van een watergang.</desc>
  <rect width="1200" height="520" fill="#f3f8f7"/>
  <rect x="36" y="36" width="1128" height="448" rx="0" fill="#ffffff" stroke="#d7e5e4" stroke-width="4"/>
  <text x="600" y="88" fill="#102321" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Afbeelding volgt</text>
  <text x="600" y="126" fill="#5f6f6d" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">Granulariteitsniveaus van watergangen</text>

  <g transform="translate(108 174)">
    <rect x="0" y="0" width="984" height="74" fill="#e6f4f6" stroke="#00a9c1" stroke-width="3"/>
    <text x="28" y="47" fill="#102321" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1</text>
    <text x="76" y="47" fill="#102321" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24">Hele gebied van de watergang</text>
  </g>

  <g transform="translate(108 268)">
    <rect x="0" y="0" width="984" height="74" fill="#edf8fa" stroke="#7fb7bd" stroke-width="3"/>
    <rect x="148" y="12" width="688" height="50" fill="#ffffff" stroke="#7fb7bd" stroke-width="2"/>
    <text x="28" y="47" fill="#102321" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">2</text>
    <text x="76" y="47" fill="#102321" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24">Waterverplaatsingsruimte, bermen en werkpaden</text>
  </g>

  <g transform="translate(108 362)">
    <rect x="0" y="0" width="984" height="74" fill="#f8fbfb" stroke="#b9d6d3" stroke-width="3"/>
    <path d="M164 60 L310 18 L456 60" fill="none" stroke="#007f91" stroke-width="5"/>
    <path d="M528 60 L674 18 L820 60" fill="none" stroke="#007f91" stroke-width="5"/>
    <text x="28" y="47" fill="#102321" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">3</text>
    <text x="856" y="47" fill="#102321" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" text-anchor="end">Talud, bodem en onderliggende elementen</text>
  </g>
